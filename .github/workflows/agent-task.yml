# Actions-hosted coding peripheral (decision 009, pilot: mini-swe-agent).
# Trigger: label an issue `agent-task` (task spec = issue body), or manual
# dispatch. The agent thinks with OUR models via the AI Gateway
# OpenAI-compat endpoint — no frontier calls, logging stays in-account.
#
# ACTIVATION (human, once): see automation/ACTIVATION.md — requires the
# CF_AI_TOKEN repo secret; until it exists this workflow fails closed
# at the guard step.
#
# Note on signed commits: the branch this pushes carries unsigned
# Actions-bot commits; merging MUST be squash (the squash commit is
# GitHub-signed, satisfying main's protection).
name: agent-task
on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task specification"
        required: true
        type: string
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: agent-task
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent-task'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Guard — secret present
        run: |
          if [ -z "${{ secrets.CF_AI_TOKEN }}" ]; then
            echo "CF_AI_TOKEN secret missing — activation incomplete (automation/ACTIVATION.md)"; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pilot agent
        run: pip install mini-swe-agent
      - name: Resolve task
        id: task
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "${{ inputs.task }}" > /tmp/task.txt
          else
            echo "${{ github.event.issue.body }}" > /tmp/task.txt
          fi
          echo "branch=agent-task/${{ github.run_id }}" >> "$GITHUB_OUTPUT"
      - name: Configure agent (non-interactive)
        run: |
          mkdir -p ~/.config/mini-swe-agent
          printf 'MSWEA_MODEL_NAME="openai/@cf/mistralai/mistral-small-3.1-24b-instruct"\nMSWEA_CONFIGURED="true"\nMSWEA_COST_TRACKING="ignore_errors"\n' > ~/.config/mini-swe-agent/.env
          # Force tool calls every turn (mistral prose-lapse cure, pilot iter 4):
          # clone the default config and inject model_kwargs via litellm.
          python3 - <<'EOF'
          import minisweagent, pathlib, yaml
          base = pathlib.Path(minisweagent.__file__).parent
          cands = sorted(base.rglob("*.yaml"))
          print("yaml candidates:", [str(c) for c in cands])
          src = [c for c in cands if "mini" in c.name.lower()] or cands
          cfg = yaml.safe_load(src[0].read_text())
          cfg.setdefault("model", {}).setdefault("model_kwargs", {}).update(
              {"tool_choice": "required", "max_tokens": 1500, "temperature": 0}
          )
          pathlib.Path("/tmp/mini-cfg.yaml").write_text(yaml.safe_dump(cfg))
          print("wrote /tmp/mini-cfg.yaml from", src[0])
          EOF
          echo 'MSWEA_MINI_CONFIG_PATH="/tmp/mini-cfg.yaml"' >> ~/.config/mini-swe-agent/.env
      - name: Run agent against Workers AI (compat endpoint)
        env:
          # litellm-style OpenAI-compatible routing through AI Gateway
          # (keeps prompt/response logging in-account, decision 003).
          OPENAI_API_KEY: ${{ secrets.CF_AI_TOKEN }}
          OPENAI_BASE_URL: https://api.cloudflare.com/client/v4/accounts/237ac99e90351553143c5a40f9019b0d/ai/v1
          MSWEA_MODEL_NAME: openai/@cf/mistralai/mistral-small-3.1-24b-instruct
        run: |
          # Exit codes from headless coding CLIs are unreliable
          # (experiments/003); git state in the publish step is the
          # ground truth. Log tail retained for forensics.
          mini --yolo --task "$(cat /tmp/task.txt)" 2>&1 | tail -100 || echo "mini exited nonzero (continuing; git diff decides)"
          git status --short
      - name: Publish branch + PR (GitHub-signed via createCommitOnBranch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then echo "no changes produced"; exit 0; fi
          BRANCH="${{ steps.task.outputs.branch }}"
          HEAD=$(gh api repos/${{ github.repository }}/git/ref/heads/main --jq .object.sha)
          gh api repos/${{ github.repository }}/git/refs -f ref="refs/heads/$BRANCH" -f sha="$HEAD" >/dev/null
          # Commit every changed/added file through GraphQL so GitHub
          # signs the commit (satisfies main's signed-commit rule; #53).
          ADDITIONS="[]"
          while IFS= read -r F; do
            [ -f "$F" ] || continue  # deletions unsupported in v1; agent tasks are additive
            ADDITIONS=$(jq -c --arg p "$F" --arg c "$(base64 -w0 "$F")" '. + [{path:$p, contents:$c}]' <<<"$ADDITIONS")
          done < <(git diff --name-only; git ls-files --others --exclude-standard)
          jq -nc --arg repo "${{ github.repository }}" --arg branch "$BRANCH" --arg head "$HEAD" \
             --arg msg "agent-task: $(head -c 60 /tmp/task.txt)" --argjson adds "$ADDITIONS" \
             '{query: "mutation($input: CreateCommitOnBranchInput!){ createCommitOnBranch(input:$input){ commit { oid } } }",
               variables: {input: {branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                 message: {headline: $msg}, expectedHeadOid: $head,
                 fileChanges: {additions: $adds}}}}' > /tmp/commit.json
          gh api graphql --input /tmp/commit.json
          gh pr create --title "agent-task: $(head -c 60 /tmp/task.txt)" \
            --body "Authored by the Actions-hosted coding peripheral (decision 009). Commit is GitHub-signed (createCommitOnBranch); merges need no bypass." \
            --base main --head "$BRANCH"
